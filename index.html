<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
  <h1 class="text-focus-in">Jovi Green</h1>
<div id="nav-placeholder"></div>
<!------------------------------------------------------------------------------>   
<!--These lines displays the light and dark toggle button----------------------->
<!------------------------------------------------------------------------------>

<div class="wrapper">
    <img id="my_pic" src="images/me_dark.png" title="Picture of Jovi" class="me" alt="Picture of Jovi">    
    
    <p class="intro_message" id="intro_Message"></p>
</div>


<!---------------------------------------------------------------------------->
<!--These lines contain social media buttons with the "social" class---------->
<!---------------------------------------------------------------------------->
  <footer class="footer">
    <p>&copy; Copyright 2025 Jovi Green. All rights reserved.</p>
    <nav class="social">
      <a href="index.html" aria-current="page"></a>

      <a href="https://facebook.com" aria-label="Visit my Facebook page" target="_blank" rel="noopener noreferrer">
        <img src="images/fb_icon.svg" alt="Facebook" width="40">
      </a>

      <a href="https://spotify.com" aria-label="Explore my Spotify playlists" target="_blank" rel="noopener noreferrer">
        <img src="images/spot_icon.svg" alt="Spotify" width="40">
      </a>

      <a href="https://discord.com" aria-label="Add me on Discord" target="_blank" rel="noopener noreferrer">
        <img src="images/discord_icon.svg" alt="Discord" width="40">
      </a>
    </nav>
      <p>
      <a href="https://jigsaw.w3.org/css-validator/check/referer">
        <img
          style="border:0;width:88px;height:31px"
          src="https://jigsaw.w3.org/css-validator/images/vcss-blue"
          alt="Valid CSS!" />
      </a>
    </p>
  </footer>

<div class="spotify_Wrapper">
  <iframe
    class="spotify-player" title="Spotify"
    src="https://open.spotify.com/embed/playlist/6AgePcKWc8IdwlHVF6TlEz?utm_source=generator&theme=0"
    frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="lazy">
  </iframe>
</div>

<!----------------------------------------------------------------------------->
  <audio id="clickSound" src="audio/clicktone.wav" preload="auto"></audio>
  <audio id="toggleSound" src="audio/lightswitch.mp3" preload="auto"></audio>
  <script src="scripts.js"></script>
  <script src="navLoader.js"></script>
</body>

</html>
